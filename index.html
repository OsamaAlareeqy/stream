<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Together - Screen Share & Voice Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Setup Screen */
        #setupScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .setup-content {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .setup-content h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .setup-content > p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .btn {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 14px;
            width: auto;
            margin-right: 10px;
        }

        .room-code-box {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .room-code-label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .room-code-display {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .copy-btn:hover {
            background: #7c8ff5;
        }

        .room-hint {
            font-size: 12px;
            color: #888;
        }

        .divider {
            position: relative;
            margin: 30px 0;
            display: flex;
            align-items: center;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider-text {
            padding: 0 12px;
            color: #666;
            font-size: 13px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            background: #222;
        }

        .status {
            font-size: 13px;
            color: #aaa;
            margin-top: 20px;
            font-style: italic;
            min-height: 20px;
        }

        .status.success {
            color: #4ade80;
        }

        .status.error {
            color: #f87171;
        }

        /* Sharing Screen */
        #sharingScreen {
            display: none;
            min-height: 100vh;
        }

        .sharing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .sharing-header h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-stop {
            background: #ee5a6f;
        }

        .btn-stop:hover {
            background: #f5747e;
        }

        .btn-start {
            background: #667eea;
        }

        .btn-start:hover {
            background: #7c8ff5;
        }

        .btn-mic {
            background: #667eea;
        }

        .btn-mic.off {
            background: #666;
        }

        .btn-mic:hover {
            opacity: 0.9;
        }

        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 8px;
            display: block;
            object-fit: contain;
        }

        .status-sharing {
            font-size: 14px;
            color: #aaa;
            margin-top: 16px;
            text-align: center;
            font-style: italic;
            min-height: 20px;
        }

        .status-sharing.success {
            color: #4ade80;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .setup-content h1 {
                font-size: 28px;
            }

            .room-code-display {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .sharing-header {
                flex-direction: column;
                align-items: stretch;
            }

            .button-group {
                width: 100%;
            }

            .btn-action {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div id="setupScreen">
            <div class="setup-content">
                <h1>Watch Together</h1>
                <p>Screen share and watch movies with your friends</p>

                <div id="createRoomSection">
                    <button class="btn btn-primary" onclick="createRoom()">
                        Create Room
                    </button>
                </div>

                <div id="roomCodeSection" class="hidden">
                    <div class="room-code-box">
                        <div class="room-code-label">Your Room Code</div>
                        <div class="room-code-display" id="displayCode"></div>
                        <button class="copy-btn" onclick="copyCode()">
                            Copy Code
                        </button>
                        <div class="room-hint">
                            Share this code with your friend to join
                        </div>
                    </div>
                </div>

                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">OR JOIN</span>
                    <div class="divider-line"></div>
                </div>

                <input 
                    type="text" 
                    id="joinCodeInput"
                    placeholder="Enter room code"
                    onkeypress="if(event.key==='Enter') joinRoom()"
                >

                <button class="btn btn-secondary" onclick="joinRoom()">
                    Join Room
                </button>

                <div class="status" id="setupStatus"></div>
            </div>
        </div>

        <!-- Sharing Screen -->
        <div id="sharingScreen" class="hidden">
            <div class="sharing-header">
                <h2 id="sharingTitle">Ready to Share</h2>

                <div class="button-group">
                    <button 
                        id="startBtn"
                        class="btn-action btn-start" 
                        onclick="startSharing()"
                    >
                        Start Sharing
                    </button>
                    <button 
                        id="stopBtn"
                        class="btn-action btn-stop hidden" 
                        onclick="stopSharing()"
                    >
                        Stop Share
                    </button>
                    <button 
                        id="micBtn"
                        class="btn-action btn-mic hidden" 
                        onclick="toggleMic()"
                    >
                        🎤 On
                    </button>
                </div>
            </div>

            <video id="screenVideo" autoplay playsinline></video>

            <div class="status-sharing" id="sharingStatus"></div>
        </div>
    </div>

    <script>
        let currentRoomCode = '';
        let screenStream = null;
        let micStream = null;
        let isMicOn = true;

        function setStatus(message, type = 'normal') {
            const statusEl = document.getElementById('setupStatus');
            statusEl.textContent = message;
            statusEl.className = 'status';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
        }

        function setSharingStatus(message, type = 'normal') {
            const statusEl = document.getElementById('sharingStatus');
            statusEl.textContent = message;
            statusEl.className = 'status-sharing';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
        }

        function createRoom() {
            // Generate random 6-character code
            currentRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // Show room code
            document.getElementById('createRoomSection').classList.add('hidden');
            document.getElementById('roomCodeSection').classList.remove('hidden');
            document.getElementById('displayCode').textContent = currentRoomCode;
            
            setStatus('Room created! Share the code with your friend.', 'success');
        }

        function copyCode() {
            navigator.clipboard.writeText(currentRoomCode).then(() => {
                setStatus('✓ Code copied to clipboard!', 'success');
                setTimeout(() => setStatus(''), 2000);
            });
        }

        function joinRoom() {
            const code = document.getElementById('joinCodeInput').value.toUpperCase().trim();
            
            if (!code) {
                setStatus('Please enter a room code', 'error');
                return;
            }
            
            currentRoomCode = code;
            goToSharingScreen();
            setSharingStatus('Connected! Ready to share your screen.', 'success');
        }

        function goToSharingScreen() {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('sharingScreen').classList.remove('hidden');
        }

        async function startSharing() {
            try {
                setSharingStatus('Starting screen share...');
                
                // Request screen share with audio
                const displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always'
                    },
                    audio: true // Captures browser audio (movie, etc)
                });

                screenStream = displayStream;

                // Try to get microphone
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                    micStream = audioStream;
                } catch (e) {
                    console.log('Microphone not available, but screen share will work');
                }

                // Display in video element
                const videoEl = document.getElementById('screenVideo');
                videoEl.srcObject = displayStream;

                // Update UI
                document.getElementById('startBtn').classList.add('hidden');
                document.getElementById('stopBtn').classList.remove('hidden');
                document.getElementById('micBtn').classList.remove('hidden');
                document.getElementById('sharingTitle').textContent = '🔴 Live Screen Share';

                setSharingStatus('✓ Screen sharing active! Your friend can see your screen, movie audio, and hear you.', 'success');

            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    setSharingStatus('Screen sharing was cancelled', 'error');
                } else if (error.name === 'NotFoundError') {
                    setSharingStatus('No screen sharing available on this device', 'error');
                } else {
                    setSharingStatus('Error: ' + error.message, 'error');
                }
            }
        }

        function stopSharing() {
            // Stop all tracks
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }

            // Clear video
            const videoEl = document.getElementById('screenVideo');
            videoEl.srcObject = null;

            // Update UI
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('micBtn').classList.add('hidden');
            document.getElementById('sharingTitle').textContent = 'Ready to Share';
            isMicOn = true;
            document.getElementById('micBtn').textContent = '🎤 On';
            document.getElementById('micBtn').classList.remove('off');

            setSharingStatus('Screen sharing stopped');
        }

        function toggleMic() {
            if (micStream) {
                const audioTracks = micStream.getAudioTracks();
                audioTracks.forEach(track => {
                    track.enabled = !track.enabled;
                });
                
                isMicOn = !isMicOn;
                const micBtn = document.getElementById('micBtn');
                if (isMicOn) {
                    micBtn.textContent = '🎤 On';
                    micBtn.classList.remove('off');
                } else {
                    micBtn.textContent = '🔇 Muted';
                    micBtn.classList.add('off');
                }
            } else if (screenStream) {
                // Try to toggle screen stream audio
                const audioTracks = screenStream.getAudioTracks();
                audioTracks.forEach(track => {
                    track.enabled = !track.enabled;
                });
                
                isMicOn = !isMicOn;
                const micBtn = document.getElementById('micBtn');
                if (isMicOn) {
                    micBtn.textContent = '🎤 On';
                    micBtn.classList.remove('off');
                } else {
                    micBtn.textContent = '🔇 Muted';
                    micBtn.classList.add('off');
                }
            }
        }
    </script>
</body>
</html>
